name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  windows-and-protocol:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true
      - name: Test and build standalone server
        working-directory: server
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path ../tests/PaperTodo.Tests/bin/win-x64 -Force | Out-Null
          go build -o ../tests/PaperTodo.Tests/bin/win-x64/papertodo-server.exe .
      - name: Windows regression tests
        run: dotnet test tests/PaperTodo.Tests/PaperTodo.Tests.csproj -c Release --logger trx --results-directory TestResults
      - name: Actual WPF editors and shared protocol fixture
        run: dotnet run --project tests/PaperTodo.UiTests/PaperTodo.UiTests.csproj -c Release -- "$env:RUNNER_TEMP/protocol-fixture"
      - name: Restore Android dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Actual C# to Dart to C# roundtrip
        run: |
          dart --packages=mobile/.dart_tool/package_config.json tests/sync_roundtrip.dart "$env:RUNNER_TEMP/protocol-fixture/cross-platform-fixture.json" "$env:RUNNER_TEMP/protocol-fixture/phone-roundtrip.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/PaperTodo.UiTests/PaperTodo.UiTests.csproj -c Release --no-build -- "$env:RUNNER_TEMP/protocol-fixture" --verify-roundtrip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-evidence
          path: TestResults

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true
      - name: Restore
        working-directory: mobile
        run: flutter pub get
      - name: Analyze
        working-directory: mobile
        run: flutter analyze --no-pub
      - name: Business and actual page regressions
        working-directory: mobile
        run: flutter test --no-pub
      - name: Build isolated test app
        working-directory: mobile
        run: flutter build apk --debug --no-pub
      - name: Compile instrumentation and unsigned release validation
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebugAndroidTest -PpapertodoAutomationTest=true
          ./gradlew :app:assembleRelease -PpapertodoUnsignedValidation=true
      - uses: actions/upload-artifact@v4
        with:
          name: android-validation-only
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
