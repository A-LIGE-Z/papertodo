name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag, defaults to the Windows project version'
        required: false
        type: string
      prerelease:
        description: 'Publish as a prerelease'
        default: false
        type: boolean
      stable_release_confirmed:
        description: 'Confirms real-device, multi-monitor and mixed-DPI acceptance for a stable release'
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
          REQUESTED_PRERELEASE: ${{ inputs.prerelease }}
          STABLE_CONFIRMED: ${{ inputs.stable_release_confirmed }}
        run: |
          python - <<'PY'
          import os, re, xml.etree.ElementTree as ET
          version = ET.parse('PaperTodo.csproj').findtext('.//Version')
          mobile_version = re.search(r'^version:\s*([^+\s]+)', open('mobile/pubspec.yaml', encoding='utf-8').read(), re.M)
          if not mobile_version or mobile_version.group(1) != version:
              raise SystemExit('Windows and Android product versions must match')
          tag = os.environ['GITHUB_REF_NAME'] if os.environ['GITHUB_EVENT_NAME'] == 'push' else os.environ.get('REQUESTED_TAG') or f'v{version}'
          if not re.fullmatch(r'v[0-9]+(?:\.[0-9]+){1,3}(?:-?(?:alpha|beta|preview|rc)[A-Za-z0-9.-]*)?', tag, re.I):
              raise SystemExit('Invalid release tag')
          if re.match(r'v[0-9]+(?:\.[0-9]+){1,3}', tag).group() != f'v{version}':
              raise SystemExit('Tag version differs from PaperTodo.csproj')
          stable = not re.search(r'alpha|beta|preview|rc', tag, re.I)
          if stable and (os.environ['GITHUB_EVENT_NAME'] != 'workflow_dispatch' or os.environ.get('STABLE_CONFIRMED') != 'true'):
              raise SystemExit('Stable releases require workflow_dispatch and explicit acceptance confirmation')
          prerelease = not stable or os.environ.get('REQUESTED_PRERELEASE') == 'true'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\ntag={tag}\nprerelease={str(prerelease).lower()}\n')
          PY

  windows:
    needs: [quality, metadata]
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build both Windows x64 single files
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          $selfOutput = Join-Path $env:RUNNER_TEMP 'papertodo-self'
          $frameworkOutput = Join-Path $env:RUNNER_TEMP 'papertodo-framework'
          dotnet publish PaperTodo.csproj -c Release -r win-x64 --self-contained true -o $selfOutput /p:PublishSingleFile=true /p:PublishReadyToRun=false /p:IncludeNativeLibrariesForSelfExtract=true /p:EnableCompressionInSingleFile=true /p:PublishTrimmed=false /p:DebugType=none /p:DebugSymbols=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath (Join-Path $selfOutput 'PaperTodo.exe') -Destination "release/PaperTodo-v$env:RELEASE_VERSION-win-x64-self-contained-small.exe"
          dotnet publish PaperTodo.csproj -c Release -r win-x64 --self-contained false -o $frameworkOutput /p:PublishSingleFile=true /p:PublishReadyToRun=false /p:EnableCompressionInSingleFile=false /p:PublishTrimmed=false /p:DebugType=none /p:DebugSymbols=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath (Join-Path $frameworkOutput 'PaperTodo.exe') -Destination "release/PaperTodo-v$env:RELEASE_VERSION-win-x64-no-runtime.exe"
      - uses: sigstore/cosign-installer@v3
      - name: Sign Windows executable provenance
        run: |
          foreach ($exe in Get-ChildItem -LiteralPath release -Filter *.exe) {
            cosign sign-blob --yes --output-signature "$($exe.FullName).sig" --output-certificate "$($exe.FullName).crt" $exe.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/*
          if-no-files-found: error

  android:
    needs: [quality, metadata]
    runs-on: ubuntu-latest
    env:
      PAPERTODO_KEYSTORE_BASE64: ${{ secrets.PAPERTODO_KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 }}
      PAPERTODO_KEY_ALIAS: ${{ secrets.PAPERTODO_KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
      PAPERTODO_KEYSTORE_PASSWORD: ${{ secrets.PAPERTODO_KEYSTORE_PASSWORD || secrets.ANDROID_STORE_PASSWORD }}
      PAPERTODO_KEY_PASSWORD: ${{ secrets.PAPERTODO_KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true
      - name: Load formal signing certificate
        run: |
          python - <<'PY'
          import os, base64, pathlib
          for name in ('PAPERTODO_KEYSTORE_BASE64', 'PAPERTODO_KEY_ALIAS', 'PAPERTODO_KEYSTORE_PASSWORD', 'PAPERTODO_KEY_PASSWORD'):
              if not os.environ.get(name): raise SystemExit(f'Missing release secret: {name}')
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'papertodo-release.jks'
          path.write_bytes(base64.b64decode(os.environ['PAPERTODO_KEYSTORE_BASE64'], validate=True))
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as output: output.write(f'PAPERTODO_KEYSTORE_PATH={path}\n')
          PY
      - name: Build and verify signed APK
        working-directory: mobile
        run: |
          flutter pub get
          flutter build apk --release --no-pub
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$signer"
          "$signer" verify --print-certs build/app/outputs/flutter-apk/app-release.apk > "$RUNNER_TEMP/apk-certificate.txt"
          if grep -q 'CN=Android Debug' "$RUNNER_TEMP/apk-certificate.txt"; then echo 'Debug certificates cannot be released'; exit 1; fi
          version=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          mkdir -p ../release
          cp build/app/outputs/flutter-apk/app-release.apk "../release/PaperTodo-android-v$version.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release/*.apk
          if-no-files-found: error

  server:
    needs: [quality, metadata]
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '0'
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - name: Build standalone service executables
        working-directory: server
        run: |
          mkdir -p ../release
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o "../release/papertodo-server-v$RELEASE_VERSION-linux-x64" .
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o "../release/papertodo-server-v$RELEASE_VERSION-win-x64.exe" .
      - uses: actions/upload-artifact@v4
        with:
          name: release-server
          path: release/*
          if-no-files-found: error

  publish:
    needs: [metadata, windows, android, server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      IS_PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Record checksums, source identity and release notes
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, re
          root = pathlib.Path('release')
          artifacts = []
          for path in sorted(root.iterdir()):
              if path.is_file(): artifacts.append({'file': path.name, 'bytes': path.stat().st_size, 'sha256': hashlib.sha256(path.read_bytes()).hexdigest()})
          (root / 'SHA256SUMS.txt').write_text(''.join(f"{entry['sha256']}  {entry['file']}\n" for entry in artifacts))
          (root / 'build-manifest.json').write_text(json.dumps({'tag': os.environ['RELEASE_TAG'], 'gitCommit': os.environ['GITHUB_SHA'], 'artifacts': artifacts}, indent=2))
          changelog = pathlib.Path('CHANGELOG.md').read_text(encoding='utf-8-sig')
          tag = os.environ['RELEASE_TAG']
          match = re.search(r'^### ' + re.escape(tag) + r'(?:[ \t][^\n]*)?\r?\n(.*?)(?=^### |\Z)', changelog, re.M | re.S)
          if not match and os.environ['IS_PRERELEASE'] == 'true': match = re.search(r'^### Unreleased\s*\n(.*?)(?=^### |\Z)', changelog, re.M | re.S)
          if not match: raise SystemExit('Move accepted release notes into the version section before publishing a stable release')
          (root / 'RELEASE_NOTES.md').write_text(match.group(1).strip() + '\n\n**下载说明**\n\n- Windows：`self-contained-small.exe` 内含运行库，可直接运行；`no-runtime.exe` 需要安装 .NET 10 Desktop Runtime。\n- Android：APK 使用已配置的正式证书签名。\n- 独立同步服务：提供 Windows / Linux x64 版本，Linux 下载后需执行 `chmod +x`。\n- 校验：下载 `SHA256SUMS.txt` 与 `build-manifest.json` 核对文件哈希和源码提交。\n', encoding='utf-8')
          PY
      - name: Publish only after every component and quality check has passed
        run: |
          mapfile -t assets < <(find release -maxdepth 1 -type f ! -name RELEASE_NOTES.md -print | sort)
          latest=false
          if [ "$IS_PRERELEASE" = false ]; then latest=true; fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" --title "PaperTodo $RELEASE_TAG" --notes-file release/RELEASE_NOTES.md --prerelease="$IS_PRERELEASE" --latest="$latest"
          else
            flags=()
            if [ "$IS_PRERELEASE" = true ]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${assets[@]}" --target "$GITHUB_SHA" --title "PaperTodo $RELEASE_TAG" --notes-file release/RELEASE_NOTES.md --latest="$latest" "${flags[@]}"
          fi
