version: '3.8'

services:
  papertodo-sync:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: papertodo-sync-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - PAPERTODO_PORT=8080
      - PAPERTODO_TOKEN=${PAPERTODO_TOKEN:?Set a unique PAPERTODO_TOKEN}
      - PAPERTODO_HOST=0.0.0.0
      - PAPERTODO_DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
