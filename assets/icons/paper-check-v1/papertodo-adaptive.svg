<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <title>PaperTodo — blue paper</title>
  <desc>Two quiet sheets of paper and a confident blue check, on a rounded blue tile.</desc>
  <defs>
    <linearGradient id="tile" x1="166" y1="74" x2="794" y2="998" gradientUnits="userSpaceOnUse">
      <stop stop-color="#438BFA" />
      <stop offset=".54" stop-color="#2D70ED" />
      <stop offset="1" stop-color="#2454C9" />
    </linearGradient>
    <linearGradient id="paper" x1="424" y1="232" x2="627" y2="807" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#EFF4FF" />
    </linearGradient>
    <linearGradient id="fold" x1="613" y1="243" x2="696" y2="377" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DCE9FF" />
      <stop offset="1" stop-color="#B8D2FC" />
    </linearGradient>
    <linearGradient id="check" x1="377" y1="515" x2="637" y2="596" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2E79F1" />
      <stop offset="1" stop-color="#2357CA" />
    </linearGradient>
    <filter id="paper-shadow" x="130" y="168" width="704" height="727" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#123C94" flood-opacity=".22" />
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#113C95" flood-opacity=".10" />
    </filter>
    <filter id="fold-shadow" x="566" y="203" width="197" height="206" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="-3" dy="6" stdDeviation="6" flood-color="#5482CD" flood-opacity=".12" />
    </filter>
    <path id="sheet" d="M336 218H586C598 218 610 223 618 232L728 342C736 350 740 360 740 372V738C740 766 718 788 690 788H336C308 788 286 766 286 738V268C286 240 308 218 336 218Z" />
    <clipPath id="sheet-clip"><use href="#sheet" /></clipPath>
  </defs>
  <g transform="translate(512 512) scale(.8) translate(-512 -512)"><g filter="url(#paper-shadow)">
    <rect x="235" y="281" width="454" height="527" rx="45" transform="rotate(-11 462 544.5)" fill="#ABCDFD" />
    <use href="#sheet" fill="url(#paper)" />
  </g>
  <g clip-path="url(#sheet-clip)">
    <path d="M590 218L740 368H630C608 368 590 350 590 328V218Z" fill="url(#fold)" filter="url(#fold-shadow)" />
    <path d="M381 520L470 608L645 428" stroke="url(#check)" stroke-width="69" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</g></svg>